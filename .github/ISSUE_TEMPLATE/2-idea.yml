name: Idea or wish
description: Something the harness could do, or do better.
labels: [enhancement]
body:
  - type: textarea
    id: goal
    attributes: { label: "What are you trying to do?", description: "The situation, in your own words." }
    validations: { required: true }
  - type: textarea
    id: help
    attributes: { label: "What would help?", description: "Your idea, if you have one. \"I don't know\" is a fine answer." }
